name: tests

# The suite is fully offline: every HTTP call goes to a local mock upstream
# started on 127.0.0.1, and Git tests use throwaway bare repositories.
# No secrets, credentials, or external services are required.
on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same branch to save runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Deliberately no `uv`: only pip and the packages the offline tests import.
      # Pin versions to avoid CI drift; when upgrading, keep the pyproject
      # constraints in sync.
      - name: Install test dependencies
        run: python -m pip install fastapi==0.162.7 uvicorn==0.54.0 httpx==0.28.1 pytest==9.2.0 pytest-asyncio==1.5.0

      - name: Run offline test suite
        run: python -m pytest -q
